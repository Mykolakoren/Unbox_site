    <!-- IBM Plex Sans + Mono — единый шрифт Unbox (--font-sans / --font-mono в
         src/index.css), в том числе в мобильной версии /m. preconnect —
         чтобы шрифт приходил раньше. 800 у Plex Sans нет (Google отдаёт 400–700). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

        "@context": "https://schema.org",
        "@type": "HealthAndBeautyBusiness",

        "url": "https://unbox.com.ge/",
        "telephone": "+995 599 324 668",
        "email": "unbox.psy@gmail.com",

  <body>
    <!-- Волна 2 (X5-05): заглушка до загрузки приложения — вместо пустого
         белого экрана на медленной сети. React заменит её при первом рендере.
         Цвета — токены: бумага #FAFAF7 на сайте, #F4F4F2 в приложении /m. -->
    <style>
      .boot { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
              background: #FAFAF7; color: #0F0F10; font: 600 20px/1.2 'IBM Plex Sans', sans-serif; letter-spacing: -0.01em; }
      html[data-boot="shell"] .boot { background: #F4F4F2; }
      .boot span { display: block; width: 48px; height: 2px; margin: 12px auto 0; background: #0F0F10; opacity: .2;
                   animation: boot-pulse 1.2s ease-in-out infinite; }
      @keyframes boot-pulse { 50% { opacity: .6; } }
      @media (prefers-reduced-motion: reduce) { .boot span { animation: none; } }
    </style>
    <script>
      try { if (/^\/m(\/|$)/.test(location.pathname)) document.documentElement.setAttribute('data-boot', 'shell'); } catch (e) {}
    </script>
    <div id="root"><div class="boot" role="status" aria-label="Загружаем Unbox"><div>Unbox<span></span></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
